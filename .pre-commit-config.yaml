repos:
  # Prettier - usando versão local do projeto
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: .pre-commit-hooks/prettier-wrapper.sh
        language: script
        types_or: [javascript, jsx, ts, tsx, css, markdown, yaml]
        pass_filenames: true
        exclude: |
          (?x)^(
            package.json |
            package-lock.json |
            pnpm-lock.yaml |
            yarn.lock
          )$

      - id: eslint
        name: ESLint
        entry: npx eslint
        language: system
        types: [javascript, jsx, ts, tsx]
        pass_filenames: true

  # TypeScript
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
        exclude: |
          (?x)^(
            package.json |
            tsconfig.*\.json
          )$
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # Hook customizado para validar nomeação de hooks
  - repo: local
    hooks:
      - id: validate-hook-names
        name: Validate Hook Names (camelCase)
        entry: .pre-commit-hooks/validate-hook-names.sh
        language: script
        pass_filenames: false
