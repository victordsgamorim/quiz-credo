repos:
  # Prettier - Code formatter
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: |
          (?x)^(
            package.json |
            package-lock.json |
            pnpm-lock.yaml |
            yarn.lock
          )$

  # ESLint - JavaScript linter
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npx eslint
        language: system
        types: [javascript, jsx, ts, tsx]
        pass_filenames: true

  # TypeScript
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
        exclude: package.json
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-args=--ignore-md-blanks]

  # Commitlint (optional - para validar mensagens de commit)
  - repo: https://github.com/compilerla/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--force-atom]
