name: Lint & Format Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint Code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting with Prettier
        run: npm exec prettier -- --check .

      - name: Run ESLint
        run: npm run lint

  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The hooks use the project's Prettier and ESLint (package-lock.json), not the latest ones
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pre-commit
        uses: pre-commit/action@v3.0.0
